
name: Install UCast Bridge and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - UCastBridge-Android-Builder.zip
      - UCastBridge-Android-Builder-FULL.zip
      - UCastBridge-Android-Builder-Download.zip

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Locate source archive
        id: archive
        run: |
          if [ -f UCastBridge-Android-Builder.zip ]; then
            echo "file=UCastBridge-Android-Builder.zip" >> "$GITHUB_OUTPUT"
          elif [ -f UCastBridge-Android-Builder-FULL.zip ]; then
            echo "file=UCastBridge-Android-Builder-FULL.zip" >> "$GITHUB_OUTPUT"
          elif [ -f UCastBridge-Android-Builder-Download.zip ]; then
            echo "file=UCastBridge-Android-Builder-Download.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::error::UCast Bridge source ZIP not found in repository root."
            ls -la
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/ucast-source"

          unzip -q "${{ steps.archive.outputs.file }}" \
            -d "$RUNNER_TEMP/ucast-source"

          PROJECT="$RUNNER_TEMP/ucast-source/UCastBridge"

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Android project not found inside ZIP."
            find "$RUNNER_TEMP/ucast-source" -maxdepth 4 -type f
            exit 1
          fi

          cp -a "$PROJECT/." "$GITHUB_WORKSPACE/"

          echo "Project extracted successfully."
          ls -la

      - name: Commit installed Android source
        env:
          BRANCH_NAME: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Do not push a new GitHub Actions workflow.
          # This avoids the special workflow permission restriction.
          git reset -q -- .github/workflows/build-apk.yml || true

          if ! git diff --cached --quiet; then
            git commit -m "Install UCast Bridge Android project"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "No source changes to commit."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify generated APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload UCast Bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: UCastBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
