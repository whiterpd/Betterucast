
name: Install UCast Bridge and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - UCastBridge-Android-Builder.zip
      - UCastBridge-Android-Builder-FULL.zip
      - UCastBridge-Android-Builder-Download.zip

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      # Find the uploaded source archive.
      - name: Locate source archive
        id: archive
        shell: bash
        run: |
          if [ -f "UCastBridge-Android-Builder.zip" ]; then
            echo "file=UCastBridge-Android-Builder.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "UCastBridge-Android-Builder-FULL.zip" ]; then
            echo "file=UCastBridge-Android-Builder-FULL.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "UCastBridge-Android-Builder-Download.zip" ]; then
            echo "file=UCastBridge-Android-Builder-Download.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::error::UCast Bridge source ZIP was not found."
            ls -la
            exit 1
          fi

      # Extract the Android project.
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ucast-source"

          unzip -q "${{ steps.archive.outputs.file }}" \
            -d "$RUNNER_TEMP/ucast-source"

          PROJECT="$RUNNER_TEMP/ucast-source/UCastBridge"

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Android project not found inside ZIP."
            find "$RUNNER_TEMP/ucast-source" -maxdepth 5 -type f
            exit 1
          fi

          cp -a "$PROJECT/." "$GITHUB_WORKSPACE/"

          echo "Android project extracted successfully."
          ls -la

      # Commit the extracted project without trying to push
      # another GitHub Actions workflow using the restricted token.
      - name: Commit installed Android source
        shell: bash
        env:
          BRANCH_NAME: main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Avoid the special workflow-file permission restriction.
          git reset -q -- .github/workflows/build-apk.yml || true

          if ! git diff --cached --quiet; then
            git commit -m "Install UCast Bridge Android project"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "No source changes to commit."
          fi

      # Configure Java.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # FIX: v4 does not request the deprecated Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Install only the SDK components required by this project.
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          yes | sdkmanager --licenses || true

      # Configure Gradle.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Confirm that the extracted project is complete.
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project verification passed."

      # Build the debug APK.
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace :app:assembleDebug

      # Confirm that the APK actually exists.
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # Make the APK available for download.
      - name: Upload UCast Bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: UCastBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
